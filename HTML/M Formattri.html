<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form attributes</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>HTML 5 Form</legend>
            Name:
            <input type="text" name="text" required="" placeholder="Enter your name" autofocus="" value="srushti" readonly="" maxlength="20"/>
            <br>
            <br>
            Color:
            <input type="color" name="color" value="#FF0000" />
            <br>
            <br>
            Hobbies:
            <input type="checkbox" name="hobbies" checked=""/> Dancing
            <input type="checkbox" name="hobbies"/> Singing 
            <br>
            <br>
            Radio:
            <input type="radio" name="M"/>Male
            <input type="radio" name="F"/>Female
            <br>
            <br>
            Age:
            <input type="number" name="age" min="1" max="25"/>
            <br>
            <br>
            Range:
            <input type="range" name="range"  value="90" min="1" max="200"/>
            <br>
            <br>
            <input type="submit" name="submit"/>
        </fieldset>
    </form>
</body>
</html>
