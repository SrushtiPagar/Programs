<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties of CSS</title>
    <style>
        .text{
            width: 1000px;
            height: 200px;
            background-color: black;
            font-size: 50px;
            color: aquamarine;
            font-weight: bolder;
            font-style: oblique;
            text-align: center;
            text-decoration: underline;
            text-transform:capitalize;
            text-decoration: underline;
            word-spacing: 10px;
            letter-spacing: 10px;
        }
        .para{
             width: 1000px;
            height: 700px;
            background-color: brown;
            font-size: 30px;
            text-align:justify;
        }
        .anchor{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="text">
        Welcome to My World
    </div>    
    <a href="" class="anchor">xyz</a>
    <p class="para">
         Freshers Hiring for 2024 & 2025 Batch at Infosys – Apply Now !🚀
We’re hiring System/Software Programmer (SP) and Digital Specialist Engineer (DSE) roles for fresh graduates who are ready to bring innovation to life! 
    </p>
</body>
</html>
